[project]
name = "sanad-argmining"
version = "0.1.0"
description = "Daleel 2026 shared task (ArabicNLP 2026, closed track): Task 1 multi-label ADU classification and Task 2 span detection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers==4.46.3",
    "datasets==3.1.0",
    "accelerate==1.1.1",
    "scikit-learn==1.5.2",
    "pytorch-crf==0.7.2",
    "pyyaml>=6.0",
    "wandb>=0.18",
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sanad-train-task1 = "train_task1:main"
sanad-train-task2 = "train_task2:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = [
    "src/data/**",
    "src/text/**",
    "src/models/**",
    "src/pretraining/**",
    "src/postprocessing/**",
    "src/evaluation/**",
    "src/utils/**",
    "src/train_task1.py",
    "src/train_task2.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
