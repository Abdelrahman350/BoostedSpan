# Task 2 enhanced_track_a_v2_eval: enhanced_track_a_v2.yaml + 5-fold CV (replacing
# the single 85/15 split -- near-universal in low-resource shared-task winning systems)
# + training on the organizers' published dev gold labels (829 labeled paragraphs
# total instead of 612). EVAL-PHASE ONLY: submission.phase=eval enforces this
# (train_task2.py hard-errors if train_on_dev_refs=true is combined with
# phase=dev -- that would be leakage for a dev-phase submission). Predictions go
# through predict_eval.py against data/test/test_in.jsonl, not train_task2.py's own
# dev_in prediction path, since this config's model must never be scored against data
# it trained on.
#
# backbones x folds = 4 x 5 = 20 runs. This is the most compute-intensive Task 2
# config in the repo -- budget accordingly (each run ~= an enhanced_track_a.yaml
# single run's cost).
task: task2
variant: enhanced_track_a
backbones:
  - CAMeL-Lab/bert-base-arabic-camelbert-mix
  - UBC-NLP/MARBERTv2
  - aubmindlab/bert-large-arabertv02
  - UBC-NLP/ARBERTv2
seeds: [42]
output_dir: outputs/task2_enhanced_track_a_v2_eval

tapt:
  enabled: true
  epochs: 10
  learning_rate: 5.0e-5
  mlm_probability: 0.15

model:
  max_seq_len: 512
  stride: 64
  use_crf: true
  gradient_checkpointing: true

training:
  epochs: 10
  per_device_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  save_best_checkpoint: true
  fgm_epsilon: 0.5
  num_folds: 5

data:
  discourse_cues: true
  jitter_augment: 2
  train_on_dev_refs: true

ensembling:
  enabled: true
  weighting: internal_f1

wandb:
  enabled: true
  project: sanad-argmining

submission:
  enabled: false
  team_name: ""
  training_setting: both
  phase: eval
