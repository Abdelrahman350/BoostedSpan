# Task 2 enhanced_track_a_weighted: same pipeline as enhanced_track_a.yaml, plus a
# per-tag class-weighted auxiliary cross-entropy alongside the CRF's own unweighted
# sequence log-likelihood (model.use_aux_ce, see models/crf_tagger.py's
# WeightedCRFTrainer / bio_class_weights_from_span_weights).
#
# Motivation: enhanced_track_a's val precision (0.6494) trails recall (0.7514)
# even after the postprocessing pipeline -- torchcrf.CRF's loss has no per-tag
# class weighting at all, so CO/ST (~5% of spans) get diluted gradient signal
# purely from rarity, unlike Task 1's encoder path which already handles this via
# AsymmetricLoss/weighted_bce_pos_weight. Reuses models/span_scorer.py's
# span_class_weights (same clipped-inverse-frequency formula, clip=20.0 already
# used for that model's span-level imbalance) unchanged, just expanded from
# 7-way (null+6 labels) to the 13-way BIO tag space. Baseline
# (enhanced_track_a.yaml) stays untouched for comparison.
task: task2
variant: enhanced_track_a
backbones:
  - CAMeL-Lab/bert-base-arabic-camelbert-mix
  - UBC-NLP/MARBERTv2
seeds: [42, 123]
output_dir: outputs/task2_enhanced_track_a_weighted

tapt:
  enabled: true
  epochs: 10
  learning_rate: 5.0e-5
  mlm_probability: 0.15

model:
  max_seq_len: 512
  stride: 64
  use_crf: true
  gradient_checkpointing: true
  use_aux_ce: true
  aux_ce_weight: 0.3
  aux_ce_clip: 20.0

training:
  epochs: 10
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  save_best_checkpoint: true

data:
  discourse_cues: true
  jitter_augment: 2

ensembling:
  enabled: true
  weighting: internal_f1

wandb:
  enabled: true
  project: sanad-argmining

# Left disabled, same reasoning as enhanced_track_a.yaml: the real submission is
# generated separately via predict_eval.py against test_in.jsonl.
submission:
  enabled: false
  team_name: Nu_Analytics
  training_setting: both
