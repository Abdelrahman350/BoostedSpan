# Task 2 boosted_crf: TAPT + discourse cues + CRF layer (Viterbi decode) +
# sliding-window chunking + multi-seed/multi-backbone ensembling via uniform
# character-level majority voting. No boundary-jitter, no weighted voting, no
# postprocessing pipeline -- those are enhanced_track_a's additions on top of this.
# Hyperparameters match the CRF-tagger foundation shared by both source notebooks.
task: task2
variant: boosted_crf
backbones:
  - CAMeL-Lab/bert-base-arabic-camelbert-mix
  - UBC-NLP/MARBERTv2
seeds: [42, 123]
output_dir: outputs/task2_boosted_crf

tapt:
  enabled: true
  epochs: 10
  learning_rate: 5.0e-5
  mlm_probability: 0.15

model:
  max_seq_len: 512
  stride: 64
  use_crf: true
  gradient_checkpointing: true

training:
  epochs: 10
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  save_best_checkpoint: true

data:
  discourse_cues: true
  jitter_augment: 0

ensembling:
  enabled: true
  weighting: uniform

wandb:
  enabled: true
  project: sanad-argmining

# Set enabled: true and team_name to package outputs/task2_boosted_crf/task_2.jsonl
# into a "{team_name}_{training_setting}.zip" submission at the end of the run.
submission:
  enabled: false
  team_name: ""
  training_setting: closed
