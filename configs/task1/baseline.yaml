# Task 1 baseline: single backbone, single seed, weighted BCE, no TAPT/ASL/cues/ensembling.
# "Everything off" -- written from CLAUDE.md section 7's prose spec (no source notebook
# for this variant exists; only the boosted variant was validated interactively).
task: task1
variant: baseline
backbones:
  - CAMeL-Lab/bert-base-arabic-camelbert-mix
seeds: [42]
output_dir: outputs/task1_baseline

tapt:
  enabled: false

model:
  max_seq_len: 512
  loss: weighted_bce
  gradient_checkpointing: false

training:
  epochs: 8
  per_device_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  save_best_checkpoint: true

data:
  discourse_cues: false
  jitter_augment: 0

ensembling:
  enabled: false
  weighting: uniform

wandb:
  enabled: false

# Set enabled: true and team_name to package outputs/task1_baseline/task_1.jsonl into
# a "{team_name}_{training_setting}.zip" submission at the end of the run.
submission:
  enabled: false
  team_name: ""
  training_setting: closed
