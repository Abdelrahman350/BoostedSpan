# Task 1 qlora_allam_weighted: same QLoRA rank-classification pipeline as
# qlora_allam.yaml, plus class-balanced per-example loss weighting
# (model.class_balanced_sft, see train_task1_generative.py's WeightedQLoRATrainer).
#
# Motivation: the plain qlora_allam run over-predicts on nearly every label even
# after ensemble_and_score's per-label threshold sweep already picks the
# F1-optimal cutoff (measured on val: gold {AS:70,OT:34,TE:22,AN:29,CO:5,ST:5} vs.
# predicted {AS:78,OT:43,TE:31,AN:34,CO:7,ST:5}) -- its SFT loss is plain
# unweighted cross-entropy over yes/no tokens, unlike the encoder path
# (AsymmetricLoss / weighted_bce_pos_weight, models/losses.py). This reuses
# weighted_bce_pos_weight unchanged (clip=8.0, same as the encoder path) to weight
# each (paragraph, label) SFT example's loss by that label's class balance.
# Baseline (qlora_allam.yaml) stays untouched for comparison.
task: task1
variant: qlora_allam
backbones:
  - humain-ai/ALLaM-7B-Instruct-preview
seeds: [42]
output_dir: outputs/task1_qlora_allam_weighted

tapt:
  enabled: false

model:
  max_seq_len: 1024
  gradient_checkpointing: true
  class_balanced_sft: true

training:
  epochs: 3
  per_device_batch_size: 2
  gradient_accumulation_steps: 32
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  save_best_checkpoint: true

data:
  discourse_cues: true
  jitter_augment: 0

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

ensembling:
  enabled: false
  weighting: uniform

wandb:
  enabled: true
  project: sanad-argmining

# Left disabled, same reasoning as the other configs: this run only predicts on
# dev_in.jsonl (practice/dev-phase set) -- the real submission is generated
# separately via predict_eval.py against test_in.jsonl.
submission:
  enabled: false
  team_name: ""
  training_setting: both
